spring:
  application:
    name: backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173,http://localhost:8081}

ai:
  enabled: ${AI_ENABLED:true}
  service:
    url: ${AI_SERVICE_URL:http://ai:8000}
  secret:
    key: ${AI_SECRET_KEY:}

server:
  port: 8080
