# テスト用プロパティ。@SpringBootTest（統合テスト）と standaloneSetup（コントローラー単体テスト）の両方で使用。
app.jwt.secret=test-secret-key-for-testing-purposes-minimum-32chars!!
app.jwt.expiration-ms=3600000
app.frontend-origin=http://localhost:5173
spring.flyway.enabled=false
ai.enabled=false
ai.service.url=http://localhost:8000
ai.secret.key=test-key
# @SpringBootTest 用: H2 インメモリ DB でコンテキストロードを完結させる
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
