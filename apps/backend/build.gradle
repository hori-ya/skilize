plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.0.7'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.skilize'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// Java 21 以上であればビルド可能。--release 21 でバイトコードを Java 21 互換に固定する
tasks.withType(JavaCompile).configureEach {
	options.release = 21
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.apache.poi:poi-ooxml:5.3.0'
	// jrxml は Jaspersoft Studio 7.0.6 (JasperReports 7.x 形式) で作成のため 7.x を使用
	implementation('net.sf.jasperreports:jasperreports:7.0.1') {
		exclude group: 'org.apache.poi', module: 'poi-ooxml'
		exclude group: 'org.apache.poi', module: 'poi'
	}
	// JasperReports 7.x では PDF エクスポートが別モジュールに分離
	implementation('net.sf.jasperreports:jasperreports-pdf:7.0.1')
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	annotationProcessor 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-test-autoconfigure'
	testImplementation 'org.springframework.security:spring-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

bootRun {
	jvmArgs = ['-XX:TieredStopAtLevel=1']
}

jacoco {
	toolVersion = "0.8.12"
}

tasks.named('test') {
	useJUnitPlatform()
	// サーバーサイドの帳票（PDF）生成は画面描画を必要としないため headless を明示する
	jvmArgs = ['-Djava.awt.headless=true']
	finalizedBy jacocoTestReport
	// 失敗時に原因例外（cause）まで含めたフルスタックトレースをコンソールに出力する
	testLogging {
		events "failed"
		exceptionFormat = "full"
		showCauses = true
		showStackTraces = true
	}
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}
