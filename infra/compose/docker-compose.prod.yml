name: skilize

services:
  db:
    image: postgres:16.4
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # ポートは外部に公開しない（コンテナ間通信のみ）

  backend:
    build:
      context: ../../
      dockerfile: infra/docker/backend/Dockerfile.prod
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        CA_CERT_ENABLED: ${CA_CERT_ENABLED:-false}
    restart: always
    env_file:
      - ../../.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # ポートは外部に公開しない（nginx 経由でのみアクセス）

  ai:
    build:
      context: ../../
      dockerfile: infra/docker/ai/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        CA_CERT_ENABLED: ${CA_CERT_ENABLED:-false}
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      AI_SECRET_KEY: ${AI_SECRET_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    # ポートは外部に公開しない（backend 経由でのみ呼び出し）

  nginx:
    build:
      context: ../../
      dockerfile: infra/docker/frontend/Dockerfile.prod
      args:
        NODE_VERSION: ${NODE_VERSION:-20}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        CA_CERT_ENABLED: ${CA_CERT_ENABLED:-false}
    ports:
      # nginx.prod.conf は非 root 実行のため 8080 でリッスン
      - "80:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: always

volumes:
  db_data:
